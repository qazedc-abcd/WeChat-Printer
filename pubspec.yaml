name: wechat_printer_print_only
description: "Material Design 3 receipt editor for Android and Windows, with direct printad and R2/S3 support."
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ^3.11.3

dependencies:
  crypto: ^3.0.8
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image: ^4.12.0
  markdown: ^7.3.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
