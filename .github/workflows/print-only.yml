name: Print Only native builds
on:
  push:
    branches: [feature/print-only-material]
    paths: ['lib/**', 'test/**', 'integration_test/**', 'tool/**', 'android/**', 'windows/**', 'pubspec.*', 'analysis_options.yaml', '.github/workflows/print-only.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: print-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Restore persistent preview signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PRINT_ONLY_PREVIEW_KEYSTORE }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/print-only-preview.jks"
          chmod 600 "$RUNNER_TEMP/print-only-preview.jks"
      - run: flutter build apk --release --split-per-abi
        env:
          PRINT_ONLY_KEYSTORE_PATH: ${{ runner.temp }}/print-only-preview.jks
          PRINT_ONLY_KEYSTORE_PASSWORD: ${{ secrets.PRINT_ONLY_PREVIEW_PASSWORD }}
      - name: Record Android build source
        run: printf '%s\n' "$GITHUB_SHA" > build/app/outputs/flutter-apk/COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiaopiao-android-preview
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/COMMIT.txt
          if-no-files-found: error
  android-clipboard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android system clipboard
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: flutter test integration_test/clipboard_test.dart -d emulator-5554 --timeout 5m
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Verify executable starts
        shell: pwsh
        run: |
          $app = (Resolve-Path 'build/windows/x64/runner/Release/xiaopiao.exe').Path
          $process = Start-Process -FilePath $app -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Native app exited during startup: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
          $env:GITHUB_SHA | Set-Content -LiteralPath 'build/windows/x64/runner/Release/COMMIT.txt' -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiaopiao-windows-x64-preview
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
