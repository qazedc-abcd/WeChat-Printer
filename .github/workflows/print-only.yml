name: Print Only native builds
on:
  push:
    branches: [feature/print-only-material]
    paths: ['lib/**', 'test/**', 'tool/**', 'android/**', 'windows/**', 'pubspec.*', 'analysis_options.yaml', '.github/workflows/print-only.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: print-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - name: Record Android build source
        run: printf '%s\n' "$GITHUB_SHA" > build/app/outputs/flutter-apk/COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiaopiao-android-preview
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/COMMIT.txt
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Verify executable starts
        shell: pwsh
        run: |
          $app = (Resolve-Path 'build/windows/x64/runner/Release/xiaopiao.exe').Path
          $process = Start-Process -FilePath $app -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Native app exited during startup: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
          $env:GITHUB_SHA | Set-Content -LiteralPath 'build/windows/x64/runner/Release/COMMIT.txt' -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiaopiao-windows-x64-preview
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
